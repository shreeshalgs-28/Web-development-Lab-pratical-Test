<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="box">
    <div class="top-bar">
      <!-- Change src to your own image file name or image URL -->
      <img id="trackerImg" src="logo.png" alt="Expense Tracker Logo" />
      <span class="title">Student Expense Tracker</span>
    </div>

    <div class="inputs">
      <input type="text" id="nameInput" placeholder="Expense name" />
      <input type="number" id="amountInput" placeholder="Amount" />
      <select id="categoryInput">
        <option value="">Select Category</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>
      <button type="button" id="addBtn">Add Expense</button>
    </div>

    <div id="errorBox" class="error"></div>

    <div class="summary-bar">
      <div class="filter-area">
        <span>Filter:</span>
        <select id="filterSelect">
          <option value="All">All</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="total-area">
        <span>Total: ₹</span>
        <span id="totalAmount">0</span>
      </div>
    </div>

    <div id="listBox" class="list-box"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
